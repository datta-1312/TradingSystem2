[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nseswing"
version = "0.1.0"
description = "Decision-support system for pullback swing trades in NSE cash equities (Upstox data/broker)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - personal use" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "requests>=2.31",
  "plotly>=5.20",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
nseswing = "nseswing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]
